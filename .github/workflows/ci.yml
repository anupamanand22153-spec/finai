name: FinAI Continuous Integration

# Trigger this workflow on every push or pull request to the main branch
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test-and-verify:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Download your repository code onto the cloud runner
      - name: Check out repository code
        uses: actions/checkout@v4

      # Step 2: Set up Python in the cloud environment
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Step 3: Install all dependencies from requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Step 4: Run your exact test checklist!
      - name: Run automated test suite
        run: |
          pytest -v